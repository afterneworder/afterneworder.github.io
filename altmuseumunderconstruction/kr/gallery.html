	<div id="artworks">
			<figure class="work">
				<a href="https://www.mauritshuis.nl/en/our-collection/artworks/670-girl-with-a-pearl-earring/">
					<img id="work1" class="hor1" alt="A portrait painting of a person wearing a turban." src="../img/3/week1/girl_with_a_pearl_earring.jpg">
					<div class="alttext" id="c1">두건을 쓰고 진주 귀고리를 한 인물의 상반신 초상화이다. 인물의 몸은 화면 왼쪽을 향하고 고개는 정면을 향해 반쯤 돌리고 있다. 인물의 피부는 밝고 눈동자는 검다. 파란 천이 이마 위를 감싸고 베이지색 천이 정수리부터 어깨까지 늘어뜨려져 있다. 옷은 황토색이다. 배경은 검다.</div>
				</a>
				<figcaption class="capver1">요하네스 페르메이르 <cite>진주 귀고리를 한 소녀</cite>, 1665</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://collections.lacma.org/node/2122885">
					<img class="ver2" alt="abc" src="../img/3/week1/crane.jpg">
					<div class="alttext" id="c2">학 일곱 마리가 서 있는 그림을 담은 여섯 폭의 병풍이다. 학은 곧게 서 있거나 고개를 숙이거나 뒤를 바라보는 등 서로 다른 자세로 있다. 학의 몸통은 희고 머리, 목, 날개 끝부분은 검다. 배경은 황토색이다. 병풍의 테두리는 갈색이며 작고 촘촘한 꽃무늬가 있다.</div>
				</a>
				<figcaption>마루야마 오쿄, <cite>학</cite>, 1772</figcaption>
			</figure>

			<figure class="work">
				<a href="https://www.getty.edu/art/collection/objects/126999/theodore-gericault-various-studies-of-lion-leg-paws-and-head-french-1812-1814/">
					<img class="hor1" alt="abc" src="../img/3/week1/various_studies_of_lion_leg_paws_and_head.jpg">
					<div class="alttext" id="c3">사자의 몸 여러 부분을 그린 스케치이다. 누런 종이에 연필로 간략하게 그렸다. 화면 위쪽 절반에는 앉아 있는 사자의 옆모습이 얼굴이 생략된 채  있고 아래쪽 절반에는 발바닥, 발, 다리, 얼굴의 형태가 흩어져 있다.</div>
				</a>
				<figcaption class="capver2">테오도르 제리코, <cite>사자의 다리, 발, 머리에 대한 다양한 연구</cite>, 1812-1814 </figcaption>
			</figure>		

			<figure class="work">
				<a href="https://collections.artsmia.org/art/7505/south-wind-katsushika-hokusai">
					<img class="ver1" alt="abc" src="../img/3/week1/fine_wind_clear_morning.jpg">
					<div class="alttext" id="c4">봉우리가 하나인 붉은 산이 우뚝 솟아 있는 풍경화이다. 그림자가 없이 평평한 색면으로 화면을 구성했다. 산 너머로 파란 하늘이 있고 작은 구름덩이가 하늘을 촘촘히 채운다. 산은 화면의 절반 정도를 차지하는 크기로 오른쪽에 치우쳐 있다. 산의 가장 윗부분은 짙은 갈색이고 여러 갈래의 흰 선이 있으며 아랫부분은 초록색이다.</div>
				</a>
				<figcaption class="capver1">가쓰시카 호쿠사이, <cite>개풍쾌청(凱風快晴)</cite>, 1830–1833</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.metmuseum.org/art/collection/search/209021?searchField=All&amp;sortBy=DateDesc&amp;deptids=12&amp;when=A.D.+1900-present&amp;showOnly=openAccess&amp;ft=*&amp;offset=0&amp;rpp=40&amp;pos=35">
					<img class="hor1" alt="abc" src="../img/3/week1/the_thinker.jpg">
					<div class="alttext" id="c5">한 손으로 턱을 괴고 앉아 있는 자세의 흰 석고상이다. 인물은 나체이고 체형은 다부지며 머리카락은 짧다. 무릎 높이의 표면이 거친 덩어리에 앉아 있다. 상체를 앞으로 기울인 채 화면 오른쪽을 향해 있다. 오른 손등으로 턱을 받치고 왼손은 무릎 위에 두었다.</div>
				</a>
				<figcaption>오귀스트 로댕, <cite>생각하는 사람</cite>, 1904</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.metmuseum.org/art/collection/search/13390?searchField=All&amp;sortBy=Relevance&amp;high=on&amp;ao=on&amp;showOnly=openAccess&amp;ft=*&amp;offset=680&amp;rpp=40&amp;pos=706">
					<img class="hor1" alt="abc" src="../img/3/week1/bird_s_nest_in_cattails.jpg">
					<div class="alttext" id="c6">얇고 긴 옅은 초록색 풀 한 다발이 화면 가운데에 있는 그림이다. 풀 사이에는 베이지색 마른 풀이 둥글게 엉킨 채 얹어져 있다. 배경은 텅 비어 있고 연한 갈색이다.</div>
				</a>
				<figcaption>피델리아 브릿지, <cite>부들 위의 새 둥지</cite>, 1875년경</figcaption>
			</figure>

			<figure class="work">
				<a href="https://www.artic.edu/artworks/11106/bowl-of-fruit">
					<img class="hor1" alt="abc" src="../img/3/week1/bowl_of_fruit.jpg">
					<div class="alttext" id="c7">비슷한 크기의 과일 네 개가 받침이 있는 둥근 그릇에 가득 담겨있는 그림이다. 아이보리색 종이 가운데에 검은 선으로 간결하게 그렸다. </div>
				</a>
				<figcaption>마스던 하틀리, <cite>과일 그릇</cite>, 1923</figcaption>
			</figure>

			<figure class="work">
				<a href="https://foto.munchmuseet.no/fotoweb/archives/5026-Malerier/Arkiv/MM.M.00514.tif.info#c=%2Ffotoweb%2Farchives%2F5026-Malerier%2F%3Fq%3Dscream">
					<img class="hor1" alt="" src="../img/3/week1/the_scream.jpg">
					<div class="alttext" id="c8">양손으로 귀를 막고 눈을 크게 뜬 채 입을 벌리고 있는 사람 한 명이 있는 그림이다. 인물은 난간이 있는 다리 위에서 정면을 바라보고 있다. 다리 너머로 붉은 하늘과 파란색, 초록색 배경이 있다. 다리를 제외한 인물과 배경은 구불거려 일렁이는 듯하다.</div>
				</a>
				<figcaption>에드바르 뭉크, <cite>절규</cite>, 1910?</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://sammlung.belvedere.at/objects/2512/ankunft-eines-zuges-am-nordwestbahnhof-in-wien?">
					<img class="ver2" alt="abc" src="../img/3/week1/arrival_of_a_train_at_vienna_northwest_station.jpg">
					<div class="alttext" id="c9">기차역 내부의 풍경을 담은 그림이다. 역은 층고가 아주 높다. 화면 왼쪽에는 검은색 기차 한 대가 연기를 뿜으며 정면을 향해 있다. 나머지 공간에는 수십 명의 사람이 밀집해 있다. 기차와 사람들 너머에 뻥 뚫린 커다란 출입구가 있다. 출입구 밖으로 뿌연 실외가 보인다. 전체적으로 어두운 색감이다. </div>
				</a>
				<figcaption>칼 카거, <cite>비엔나 북서역에 도착한 기차</cite>, 1875</figcaption>
			</figure>

			<figure class="work">
				<a href="https://collections.tepapa.govt.nz/object/228101">
					<img class="hor1" alt="abc" src="../img/3/week2/antipodean_bowl_with_albatross.jpg">
					<div class="alttext" id="c10">새의 머리 형상이 달린 하늘색 반투명 유리그릇이다. 그릇은 위가 넓고 아래가 좁으며 굽이 있다. 새의 머리 형상은 그릇 위쪽에 달려있다. 새는 긴 부리를 벌리고 그릇 밖을 향해있다.</div>

				<a href="https://www.clevelandart.org/art/1967.215">
					<img class="hor1" alt="abc" src="../img/3/week2/composition.jpg">
					<div class="alttext" id="c11">수직선과 수평선이 화면을 여러 칸으로 나누는 추상화이다. 화면은 정사각형이다. 칸마다 비례는 서로 다르다. 칸은 대부분 흰색이며 부분적으로 빨간색, 노란색, 파란색이다.</div>
				</a>
				<figcaption class="capver1">피에트 몬드리안, <cite>빨강, 노랑, 파랑이 있는 구성</cite>, 1927 </figcaption>

			<figure class="work">
				<a href="https://www.si.edu/object/three-women:saam_2009.44.34">

					<div class="alttext" id="c12">세 여성이 정면을 바라보고 있는 사진이다. 한 명은 서 있고 두 명은 그 앞에 나란히 앉아있다. 세 사람은 피부가 밝은 편이고 검은색 드레스를 입고 있다. 드레스에는 하얀 깃이 있다. 배경색은 연한 갈색이다.</div>
				</a>
				<figcaption>작가 미상, <cite>세 여인</cite>, ca. 1865-1885</figcaption>

			<figure class="work">
				<a href="https://www.nasjonalmuseet.no/en/collection/object/NMK.2021.0041">
					<img class="ver1" alt="abc" src="../img/3/week2/flared_fluted_bowl.jpg">
					<div class="alttext" id="c13">연한 회색 그릇이다. 위는 넓고 아래는 좁으며 굽이 있다. 표면은 고르지 않고 요철이 있다. 사선으로 무늬가 있다.</div>
				</a>
				<figcaption>루시 리, <cite>플레어드 플루티드 볼</cite>, 1980년경</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.si.edu/object/button-give-women-vote:nmah_1463675">
					<img class="hor1" alt="abc" src="../img/3/week2/give_women_the_vote.jpg">
					<div class="alttext" id="c14">노란색 가로줄 두 개가 있는 동그란 검은색 버튼이다. 윗줄에는 ‘GIVE WOMEN’이라고 쓰여있다. 아랫줄에는 ‘THE VOTE’라고 쓰여있다. 글씨는 모두 검은색이고 대문자이다.</div>
				</a>
				<figcaption>작가 미상, <cite>버튼, "여성에게 투표권을"</cite></figcaption>
			</figure>		

			<figure class="work">
				<a href="https://commons.wikimedia.org/wiki/File:Önninge_Village,_Åland_(Anna_Wengberg)_-_Nationalmuseum_-_20419.tif">
					<img class="ver1" alt="abc" src="../img/3/week2/onninge_village.jpg">
					<div class="alttext" id="c15">황토색 논밭이 있는 풍경화이다. 세모나게 쌓은 짚 더미 수십 개가 논밭 군데군데 있다. 논밭 너머 멀리에 집 여러 채와 풍차 여러 개가 있다. 하늘은 옅은 회색이다.</div>
				</a>
				<figcaption>안나 윙발, <cite>오닝예 마을, 올란드</cite>, 1888</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.si.edu/object/poster-womens-march-washington-refugees-welcome:nmaahc_2017.85.15">
					<img class="ver1" alt="abc" src="../img/3/week2/refugees_welcome.jpg">
					<div class="alttext" id="c16">‘I'M NOT GIVING UP AND NEITHER SHOULD YOU!’라는 문장을 손 글씨로 크게 쓴 포스터이다. 배경은 빨간색이고 글씨는 검은색이다. 모두 대문자이다.</div>
				</a>
				<figcaption class="capver1">작가 미상, <cite>“난민 환영” 워싱턴 여성 행진 포스터</cite>, 2017</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.rijksmuseum.nl/en/search/objects?p=1&ps=12&st=Objects&ii=1#/BK-2000-17,1">
					<img class="ver1" alt="abc" src="../img/3/week2/self_portrait.jpg">
					<div class="alttext" id="c17">수염이 있는 사람의 흉상이다. 수염과 머리카락은 흑갈색이다. 머리카락은 짧다. 인물은 나체이고 피부는 밝은 편이다. 고개를 살짝 돌려 화면의 오른쪽 위를 바라보고 있다. </div>
				</a>
				<figcaption class="capver1">요한 그레고르 반 데르 샤르트, <cite>자화상</cite>, c. 1573 - c. 1580</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://www.kansallisgalleria.fi/en/object/414911">
					<img class="hor1" alt="abc" src="../img/3/week2/hare_in_winter_clothes.jpg">
					<div class="alttext" id="c18">회색 토끼가 두 발로 서 있는 그림이다. 토끼는 화면 오른쪽을 향해 측면을 보이고 있다. 토끼 너머에는 갈색 바위가 있고, 바위 너머로 초록색 나무 몇 그루가 작게 보인다.</div>
				</a>
				<figcaption>빌헬름 폰 라이트, <cite>겨울옷을 입은 토끼</cite>, 1834</figcaption>
			</figure>		

			<figure class="work">
				<a href="https://samlinger.natmus.dk/dnt/asset/24893">
					<img class="hor1" alt="abc" src="../img/3/week2/hiking_lunch_box.jpg">
					<div class="alttext" id="c19">은색 서랍이 들어 있는 검은 상자다. 상자의 한쪽 면이 열려 있어 은색 서랍이 보인다. 서랍은 일곱 칸이다. 아래쪽 몇 칸이 살짝 나와 있다. 서랍 군데군데 녹이 슬어 있다. 상자 윗면에 손잡이가 있다.</div>
				</a>
				<figcaption>작가 미상, <cite>하이킹 점심 도시락통</cite>, ca. 1980</figcaption>

			<figure class="work">
				<a href="https://www.artic.edu/artworks/16564/branch-of-the-seine-near-giverny-mist">
					<img class="hor1" alt="abc" src="../img/3/week2/branch_of_the_seine_near_giverny.jpg">
					<div class="alttext" id="c20">뿌연 연보라색조의 풍경화이다. 풍경은 흐릿하여 대상이 불분명하다. 화면 왼쪽은 색이 진하고 오른쪽은 연하다.</div>
				</a>

				<figure class="work">
				<a href="https://collection.barnesfoundation.org/objects/6385/Woman-with-Nude-Boy-at-Her-Left/">
					<img class="hor1" alt="abc" src="../img/3/week2/woman_with_nude_boy_at_her_left.jpg">
					<div class="alttext" id="c21">여성과 어린아이가 서로를 바라보고 있는 그림이다. 아이는 여성 앞에 가까이 붙어 서 있다. 여성은 아이를 내려다보고 아이는 위를 올려다본다. 여성은 살구색 옷을 입고 아이는 발가벗은 채 있다. 물감으로 옅게 스케치했다. </div>
